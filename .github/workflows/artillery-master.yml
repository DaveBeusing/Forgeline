name: Artillery Blender master qualification

on:
  pull_request:
    paths:
      - '.github/workflows/artillery-master.yml'
      - 'build/artillery/**'
      - 'assets/staged/artillery/**'
      - 'tests/ForgeLine.Presentation.Tests/ArtilleryBlender*.cs'
  push:
    branches: [master]
    paths:
      - '.github/workflows/artillery-master.yml'
      - 'build/artillery/**'
      - 'assets/staged/artillery/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retained-artillery:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify master hashes and all artillery LOD/state exports
        shell: pwsh
        run: python build/artillery/retained.py

  native-artillery:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Windows, X64, blender]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build Release
        shell: pwsh
        run: dotnet build ForgeLine.sln --configuration Release
      - name: Save, reopen, export and qualify artillery geometry and rigid poses
        shell: pwsh
        run: ./build/artillery/Qualify-Master.ps1 -OutputRoot artifacts/ar-ci
      - name: Retain native authoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artillery-master-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ar-ci
          retention-days: 14
