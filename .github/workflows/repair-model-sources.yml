name: Scoped model source repair

on:
  push:
    branches: [fix/model-texture-integrity]
    paths:
      - 'build/source_geometry.py'
      - 'build/asset-audit/repair_catalog.py'
      - '.github/workflows/repair-model-sources.yml'

permissions:
  contents: read

jobs:
  repair-reviewed-sources:
    if: github.repository == 'DaveBeusing/Forgeline' && github.ref == 'refs/heads/fix/model-texture-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.3 Pillow==12.3.0
      - name: Reproduce baseline, repair exact sources and validate all production assets
        run: python build/asset-audit/repair_catalog.py
      - name: Preserve bounded repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-repair-${{ github.sha }}
          path: artifacts/asset-repair/
          retention-days: 14
      - name: Commit only verified repairs to the existing fix branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          actual=$(git ls-remote origin refs/heads/fix/model-texture-integrity | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t paths < artifacts/asset-repair/allowed-paths.txt
          git add -- "${paths[@]}"
          git diff --cached --check
          git commit -m "Repair smelter pipe frames and artillery track sidewalls"
          git push origin HEAD:refs/heads/fix/model-texture-integrity
