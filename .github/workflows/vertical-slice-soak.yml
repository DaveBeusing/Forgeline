name: Vertical Slice Soak

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Vertical-slice balance profile
        required: true
        default: validation
        type: choice
        options:
          - validation
          - gameplay
      matches:
        description: Number of fresh matches
        required: true
        default: "5"
        type: string
      ticks_per_match:
        description: Maximum ticks per match
        required: true
        default: "80000"
        type: string
      seed:
        description: Starting deterministic seed
        required: true
        default: "2026"
        type: string

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  soak:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ForgeLine.sln

      - name: Validate project references
        shell: pwsh
        run: ./build/Validate-ProjectReferences.ps1

      - name: Build
        run: dotnet build ForgeLine.sln --configuration Release --no-restore

      - name: Run vertical slice soak
        shell: pwsh
        run: >
          ./build/Run-VerticalSliceSoak.ps1
          -Profile "${{ inputs.profile }}"
          -Matches ${{ inputs.matches }}
          -TicksPerMatch ${{ inputs.ticks_per_match }}
          -Seed ${{ inputs.seed }}
          -Output "artifacts/vertical-slice-soak.json"

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vertical-slice-soak
          path: artifacts/vertical-slice-soak.json
          if-no-files-found: warn
