name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ForgeLine.sln

      - name: Validate project references
        shell: pwsh
        run: ./build/Validate-ProjectReferences.ps1

      - name: Build
        run: dotnet build ForgeLine.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ForgeLine.sln --configuration Release --no-build
