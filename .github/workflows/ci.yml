name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Assign validation build identity
        shell: pwsh
        run: ./build/Set-BuildVersion.ps1

      - name: Validate one version increment per PR
        shell: pwsh
        env:
          FORGELINE_VERSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORGELINE_VERSION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./build/Validate-SemVer.ps1 -BaseRef "$env:FORGELINE_VERSION_BASE" -HeadRef "$env:FORGELINE_VERSION_HEAD"

      - name: Version and metadata contracts
        shell: pwsh
        run: |
          ./build/Test-Versioning.ps1
          ./build/Test-VersionAllocation.ps1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ForgeLine.sln

      - name: Validate project references
        shell: pwsh
        run: ./build/Validate-ProjectReferences.ps1

      - name: Validate bundled UI font resources
        shell: pwsh
        run: ./build/Validate-UiFonts.ps1

      - name: Build
        run: dotnet build ForgeLine.sln --configuration Release --no-restore

      - name: Compile and qualify canonical map
        run: dotnet run --project tools/ForgeLine.MapCompiler/ForgeLine.MapCompiler.csproj --configuration Release --no-build -- --output artifacts/maps/central-divide.flmap.json --qualification-output artifacts/map-qualification.json

      - name: Adaptive frontend geometry and interaction contracts
        shell: pwsh
        run: |
          dotnet test --project tests/ForgeLine.Client.Tests/ForgeLine.Client.Tests.csproj --configuration Release --no-build -- --filter-class ForgeLine.Client.Tests.FrontendLayoutHardeningTests ForgeLine.Client.Tests.FrontendPointerInteractionTests ForgeLine.Client.Tests.FrontendControlAffordanceTests ForgeLine.Client.Tests.FrontendInteractionTests ForgeLine.Client.Tests.FrontendInputLifetimeTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --project tests/ForgeLine.Presentation.Tests/ForgeLine.Presentation.Tests.csproj --configuration Release --no-build -- --filter-class ForgeLine.Presentation.Tests.FrontendOverlayRendererTests ForgeLine.Presentation.Tests.FrontendLayoutNativeTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Battlefield HUD hierarchy and interaction contracts
        shell: pwsh
        run: |
          dotnet test --project tests/ForgeLine.Presentation.Tests/ForgeLine.Presentation.Tests.csproj --configuration Release --no-build -- --filter-class ForgeLine.Presentation.Tests.HudInformationLayoutTests ForgeLine.Presentation.Tests.GameplayHudVisualQualificationTests ForgeLine.Presentation.Tests.GameplayHudLayoutIntegrationTests ForgeLine.Presentation.Tests.GameplayHudRuntimeTests ForgeLine.Presentation.Tests.ResourcePowerAlertHudTests ForgeLine.Presentation.Tests.SelectionInspectorHudTests ForgeLine.Presentation.Tests.ActionableAlertTests ForgeLine.Presentation.Tests.GameplayUiFixtureTests ForgeLine.Presentation.Tests.RtsMinimapInteractionTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --project tests/ForgeLine.Client.Tests/ForgeLine.Client.Tests.csproj --configuration Release --no-build -- --filter-class ForgeLine.Client.Tests.GameplayInteractionJourneyTests ForgeLine.Client.Tests.GameplayGuidanceInteractionTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native UI typography contracts
        run: dotnet test --project tests/ForgeLine.Presentation.Tests/ForgeLine.Presentation.Tests.csproj --configuration Release --no-build -- --filter-class ForgeLine.Presentation.Tests.UiFontMetricsTests ForgeLine.Presentation.Tests.UiTypographyNativeTests

      - name: Native material BRDF and HDR contracts
        run: dotnet test --project tests/ForgeLine.Presentation.Tests/ForgeLine.Presentation.Tests.csproj --configuration Release --no-build -- --filter-class ForgeLine.Presentation.Tests.PbrMaterialShaderTests ForgeLine.Presentation.Tests.SceneOutputIntegrationTests

      - name: Graphics quality and display contracts
        shell: pwsh
        run: |
          dotnet test --project tests/ForgeLine.Graphics.Tests/ForgeLine.Graphics.Tests.csproj --configuration Release --no-build -- --filter-class ForgeLine.Graphics.Tests.ResolutionScaleTests ForgeLine.Graphics.Tests.PostProcessingTests ForgeLine.Graphics.Tests.DepthReconstructionTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --project tests/ForgeLine.Presentation.Tests/ForgeLine.Presentation.Tests.csproj --configuration Release --no-build -- --filter-class ForgeLine.Presentation.Tests.GraphicsQualityPolicyTests ForgeLine.Presentation.Tests.RenderQualitySettingsTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --project tests/ForgeLine.Client.Tests/ForgeLine.Client.Tests.csproj --configuration Release --no-build -- --filter-class ForgeLine.Client.Tests.GraphicsSettingsTests ForgeLine.Client.Tests.ClientUserSettingsTests ForgeLine.Client.Tests.ClientSettingsFrontendAdapterTests ForgeLine.Client.Tests.FrontendInteractionTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile and qualify runtime assets
        run: dotnet run --project tools/ForgeLine.AssetCompiler/ForgeLine.AssetCompiler.csproj --configuration Release --no-build -- --mode build --source assets/source --runtime assets/runtime --clean --qualification-output artifacts/asset-qualification.json

      - name: Runtime asset process contracts
        shell: pwsh
        run: ./build/Test-RuntimeAssetPipeline.ps1

      - name: Cinematic menu image and native lifecycle contracts
        shell: pwsh
        run: |
          dotnet test --project tests/ForgeLine.Presentation.Tests/ForgeLine.Presentation.Tests.csproj --configuration Release --no-build -- --filter-class ForgeLine.Presentation.Tests.FrontendMenuBackgroundTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --project tests/ForgeLine.Client.Tests/ForgeLine.Client.Tests.csproj --configuration Release --no-build -- --filter-class ForgeLine.Client.Tests.CinematicMenuNativeTests ForgeLine.Client.Tests.FrontendLifecycleTests ForgeLine.Client.Tests.FrontendLoadingControllerTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: World environment and terrain residency contracts
        shell: pwsh
        run: |
          dotnet test --project tests/ForgeLine.Graphics.Tests/ForgeLine.Graphics.Tests.csproj --configuration Release --no-build -- --filter-class ForgeLine.Graphics.Tests.LocalAtmosphereTests ForgeLine.Graphics.Tests.D3D12AtmosphereTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --project tests/ForgeLine.Presentation.Tests/ForgeLine.Presentation.Tests.csproj --configuration Release --no-build -- --filter-class ForgeLine.Presentation.Tests.TerrainResidencyTests ForgeLine.Presentation.Tests.WorldEnvironmentSettingsTests ForgeLine.Presentation.Tests.WorldEnvironmentNativeTests ForgeLine.Presentation.Tests.VegetationVisualMotionTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --project tests/ForgeLine.Client.Tests/ForgeLine.Client.Tests.csproj --configuration Release --no-build -- --filter-class ForgeLine.Client.Tests.WorldEnvironmentPersistenceTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Combat industrial effects and decal contracts
        shell: pwsh
        run: |
          dotnet test --project tests/ForgeLine.Presentation.Tests/ForgeLine.Presentation.Tests.csproj --configuration Release --no-build -- --filter-class ForgeLine.Presentation.Tests.IndustrialEffectPresetTests ForgeLine.Presentation.Tests.CombatDecalExtractionTests ForgeLine.Presentation.Tests.DecalPoolTests ForgeLine.Presentation.Tests.RuntimeDecalMaterialTests ForgeLine.Presentation.Tests.ParticleVfxRendererTests ForgeLine.Presentation.Tests.MechanicalMotionTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test --project tests/ForgeLine.Graphics.Tests/ForgeLine.Graphics.Tests.csproj --configuration Release --no-build -- --filter-class ForgeLine.Graphics.Tests.D3D12ParticleTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Reference evidence report contracts
        shell: pwsh
        run: |
          ./build/Test-VisualReferenceEvidence.ps1
          ./build/Test-VisualDrawBudgets.ps1

      - name: Reference performance and image contracts without GPU
        shell: pwsh
        run: |
          ./build/Test-ReferencePerformance.ps1
          dotnet test --project tests/ForgeLine.Client.Tests/ForgeLine.Client.Tests.csproj --configuration Release --no-build -- --filter-class ForgeLine.Client.Tests.ReferencePerformanceSamplesTests

      - name: Native WARP reference capture
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/Invoke-RtsReferenceQualification.ps1 -Capture -Software -Scenes BattlefieldCombat -Profiles Low -Zooms NormalGameplay -Displays 640x360 -Warmups 3 -Samples 8 -OutputRoot artifacts/visual-reference-warp

      - name: Windows apphost reference completion contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/Invoke-RtsReferenceQualification.ps1 -Capture -ClientPath src/ForgeLine.Client/bin/Release/net10.0-windows/win-x64/ForgeLine.Client.exe -RuntimeAssetRoot assets/runtime -Software -Scenes BattlefieldCombat -Profiles Low -Zooms NormalGameplay -Displays 640x360 -Warmups 3 -Samples 8 -RepeatCaptures 2 -OutputRoot artifacts/visual-reference-apphost

      - name: Windows window mode and visual qualification smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/Invoke-WindowModeQualification.ps1 -Configuration Release -RenderStressInstances 1000

      - name: Rendering benchmark qualification
        run: dotnet run --project benchmarks/ForgeLine.Rendering.Benchmarks/ForgeLine.Rendering.Benchmarks.csproj --configuration Release --no-build -- --filter "*" --job Short --artifacts artifacts/rendering-benchmarks --exporters BriefJSON

      - name: Headless diagnostics smoke test
        run: dotnet run --project src/ForgeLine.Headless/ForgeLine.Headless.csproj --configuration Release --no-build -- --ticks 64 --seed 12345 --tick-rate 20 --entities 1000 --diagnostics-output artifacts/headless-smoke.json

      - name: Lightweight entity stress smoke
        run: dotnet run --project src/ForgeLine.Headless/ForgeLine.Headless.csproj --configuration Release --no-build -- --ticks 16 --seed 67890 --tick-rate 20 --entities 10000 --diagnostics-output artifacts/headless-stress-10000.json

      - name: Save and replay recovery smoke
        shell: pwsh
        run: |
          dotnet run --project src/ForgeLine.Headless/ForgeLine.Headless.csproj --configuration Release --no-build -- --scenario central-divide --profile validation --ticks 256 --seed 4242 --save-output artifacts/recovery-smoke.save.json --replay-output artifacts/recovery-smoke.replay.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/ForgeLine.Headless/ForgeLine.Headless.csproj --configuration Release --no-build -- --load-input artifacts/recovery-smoke.save.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/ForgeLine.Headless/ForgeLine.Headless.csproj --configuration Release --no-build -- --replay-input artifacts/recovery-smoke.replay.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        run: dotnet test --solution ForgeLine.sln --configuration Release --no-build

      - name: Publish reproducible pre-alpha package
        shell: pwsh
        run: ./build/Publish-PreAlpha.ps1 -Configuration Release -VerifyReproducible -RuntimeAssetRoot assets/runtime

      - name: Packaged client fresh-install smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $settingsRoot = Join-Path $env:LOCALAPPDATA "FORGELINE"
          if (Test-Path $settingsRoot) {
            Remove-Item $settingsRoot -Recurse -Force
          }

          Push-Location artifacts/prealpha/win-x64/publish
          try {
            ./ForgeLine.Client.exe --smoke-test --render-stress 1000
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

          if (-not (Test-Path (Join-Path $settingsRoot "settings.json"))) {
            throw "Fresh-install smoke did not create validated user settings."
          }

      - name: Packaged startup menu lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/Invoke-StartupQualification.ps1 -ClientPath artifacts/prealpha/win-x64/publish/ForgeLine.Client.exe -Samples 2 -RequireApplicationIcons

      - name: Two-opponent full-match validation
        run: dotnet run --project src/ForgeLine.Headless/ForgeLine.Headless.csproj --configuration Release --no-build -- --scenario central-divide --profile validation --ticks 80000 --seed 2026 --matches 1 --require-terminal --diagnostics-output artifacts/opponent-full-match.json --telemetry-output artifacts/opponent-balance-telemetry.json

      - name: Upload pre-alpha package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pre-alpha-package-${{ env.FORGELINE_BUILD_VERSION }}-attempt-${{ github.run_attempt }}
          path: artifacts/prealpha/FORGELINE-*
          if-no-files-found: error
          retention-days: 30

      - name: Upload engine diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-diagnostics-${{ env.FORGELINE_BUILD_VERSION }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/*.json
            artifacts/maps/*.json
            artifacts/visual-reference-warp/**
            artifacts/rendering-benchmarks/**
            artifacts/startup-qualification/**
          if-no-files-found: warn
