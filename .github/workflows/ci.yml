name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ForgeLine.sln

      - name: Validate project references
        shell: pwsh
        run: ./build/Validate-ProjectReferences.ps1

      - name: Build
        run: dotnet build ForgeLine.sln --configuration Release --no-restore

      - name: Compile and qualify canonical map
        run: dotnet run --project tools/ForgeLine.MapCompiler/ForgeLine.MapCompiler.csproj --configuration Release --no-build -- --output artifacts/maps/central-divide.flmap.json --qualification-output artifacts/map-qualification.json

      - name: Compile and qualify runtime assets
        run: dotnet run --project tools/ForgeLine.AssetCompiler/ForgeLine.AssetCompiler.csproj --configuration Release --no-build -- --source assets/source --runtime assets/runtime --clean --qualification-output artifacts/asset-qualification.json

      - name: Windows window mode and visual qualification smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/Invoke-WindowModeQualification.ps1 -Configuration Release -RenderStressInstances 1000

      - name: Headless diagnostics smoke test
        run: dotnet run --project src/ForgeLine.Headless/ForgeLine.Headless.csproj --configuration Release --no-build -- --ticks 64 --seed 12345 --tick-rate 20 --entities 1000 --diagnostics-output artifacts/headless-smoke.json

      - name: Lightweight entity stress smoke
        run: dotnet run --project src/ForgeLine.Headless/ForgeLine.Headless.csproj --configuration Release --no-build -- --ticks 16 --seed 67890 --tick-rate 20 --entities 10000 --diagnostics-output artifacts/headless-stress-10000.json

      - name: Save and replay recovery smoke
        shell: pwsh
        run: |
          dotnet run --project src/ForgeLine.Headless/ForgeLine.Headless.csproj --configuration Release --no-build -- --scenario vertical-slice --profile validation --ticks 256 --seed 4242 --save-output artifacts/recovery-smoke.save.json --replay-output artifacts/recovery-smoke.replay.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/ForgeLine.Headless/ForgeLine.Headless.csproj --configuration Release --no-build -- --load-input artifacts/recovery-smoke.save.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project src/ForgeLine.Headless/ForgeLine.Headless.csproj --configuration Release --no-build -- --replay-input artifacts/recovery-smoke.replay.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        run: dotnet test --solution ForgeLine.sln --configuration Release --no-build

      - name: Publish reproducible pre-alpha package
        shell: pwsh
        run: ./build/Publish-PreAlpha.ps1 -Configuration Release -VerifyReproducible

      - name: Packaged client fresh-install smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $settingsRoot = Join-Path $env:LOCALAPPDATA "FORGELINE"
          if (Test-Path $settingsRoot) {
            Remove-Item $settingsRoot -Recurse -Force
          }

          Push-Location artifacts/prealpha/win-x64/publish
          try {
            ./ForgeLine.Client.exe --smoke-test --render-stress 1000
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

          if (-not (Test-Path (Join-Path $settingsRoot "settings.json"))) {
            throw "Fresh-install smoke did not create validated user settings."
          }

      - name: Two-opponent full-match validation
        run: dotnet run --project src/ForgeLine.Headless/ForgeLine.Headless.csproj --configuration Release --no-build -- --scenario vertical-slice --profile validation --ticks 80000 --seed 2026 --matches 1 --require-terminal --diagnostics-output artifacts/opponent-full-match.json --telemetry-output artifacts/opponent-balance-telemetry.json

      - name: Upload pre-alpha package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-alpha-package
          path: artifacts/prealpha/FORGELINE-prealpha-win-x64.zip
          if-no-files-found: warn

      - name: Upload engine diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-diagnostics
          path: |
            artifacts/*.json
            artifacts/maps/*.json
          if-no-files-found: warn
