name: Blender authoring qualification

on:
  workflow_dispatch:
    inputs:
      blender_executable:
        description: 'Optional absolute executable path; empty uses pinned-version discovery'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: blender-authoring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  command-core-production:
    runs-on: [self-hosted, Windows, X64, blender]
    timeout-minutes: 45
    env:
      FORGELINE_BLENDER_PATH: ${{ inputs.blender_executable }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build Release
        shell: pwsh
        run: dotnet build ForgeLine.sln --configuration Release
      - name: Qualify saved Command Core and source-less exports
        shell: pwsh
        run: ./tools/blender/Test-BlenderCommandCore.ps1 -OutputRoot artifacts/cc-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain Command Core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-core-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/cc-*
          retention-days: 14

  export-smoke:
    runs-on: [self-hosted, Windows, X64, blender]
    timeout-minutes: 15
    env:
      FORGELINE_BLENDER_PATH: ${{ inputs.blender_executable }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build Release
        shell: pwsh
        run: dotnet build ForgeLine.sln --configuration Release
      - name: Qualify pinned Blender export
        shell: pwsh
        run: ./tools/blender/Test-BlenderSmoke.ps1 -OutputRoot artifacts/blender-ci-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Qualify production source round trips
        shell: pwsh
        run: ./tools/blender/Test-BlenderRoundTrip.ps1 -OutputRoot artifacts/blender-roundtrip-ci-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Qualify bounded surface and LOD production
        shell: pwsh
        run: ./tools/blender/Test-BlenderProduction.ps1 -OutputRoot artifacts/blender-surfaces-ci-${{ github.run_id }}-${{ github.run_attempt }} -RenderPreviews
      - name: Retain authoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-authoring-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/blender-ci-*
            artifacts/blender-roundtrip-ci-*
            artifacts/blender-surfaces-ci-*
          retention-days: 14

  rigid-authoring:
    runs-on: [self-hosted, Windows, X64, blender]
    timeout-minutes: 15
    env:
      FORGELINE_BLENDER_PATH: ${{ inputs.blender_executable }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build Release
        shell: pwsh
        run: dotnet build ForgeLine.sln --configuration Release
      - name: Qualify rigid authoring and runtime matrices
        shell: pwsh
        run: ./tools/blender/Test-BlenderMotion.ps1 -OutputRoot artifacts/blender-motion-ci-${{ github.run_id }}-${{ github.run_attempt }} -RenderPreviews
      - name: Retain rigid authoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-motion-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/blender-motion-ci-*
          retention-days: 14

  tank-production:
    runs-on: [self-hosted, Windows, X64, blender]
    timeout-minutes: 15
    env:
      FORGELINE_BLENDER_PATH: ${{ inputs.blender_executable }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build Release
        shell: pwsh
        run: dotnet build ForgeLine.sln --configuration Release
      - name: Qualify saved tank production source
        shell: pwsh
        run: ./tools/blender/Test-BlenderTank.ps1 -OutputRoot artifacts/tank-production-${{ github.run_id }}-${{ github.run_attempt }} -RenderPreviews
      - name: Retain tank production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tank-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/tank-production-*
          retention-days: 14

  rigid-clips:
    runs-on: [self-hosted, Windows, X64, blender]
    timeout-minutes: 15
    env:
      FORGELINE_BLENDER_PATH: ${{ inputs.blender_executable }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build Release
        shell: pwsh
        run: dotnet build ForgeLine.sln --configuration Release
      - name: Qualify independent rigid clips
        shell: pwsh
        run: ./tools/blender/Test-BlenderRigidClips.ps1 -OutputRoot artifacts/blender-rigid-clips-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain clip authoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-rigid-clips-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/blender-rigid-clips-*
          retention-days: 14

  infantry-skins:
    runs-on: [self-hosted, Windows, X64, blender]
    timeout-minutes: 15
    env:
      FORGELINE_BLENDER_PATH: ${{ inputs.blender_executable }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build Release
        shell: pwsh
        run: dotnet build ForgeLine.sln --configuration Release
      - name: Qualify saved infantry masters and source-less skins
        shell: pwsh
        run: ./tools/blender/Test-BlenderInfantry.ps1 -OutputRoot artifacts/blender-infantry-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain infantry authoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blender-infantry-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/blender-infantry-*
          retention-days: 14

  procedural-pbr:
    runs-on: [self-hosted, Windows, X64, blender]
    timeout-minutes: 20
    env:
      FORGELINE_BLENDER_PATH: ${{ inputs.blender_executable }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build Release
        shell: pwsh
        run: dotnet build ForgeLine.sln --configuration Release
      - name: Qualify deterministic CPU atlas baking and source-less compilation
        shell: pwsh
        run: ./tools/blender/Test-ProceduralPbr.ps1 -OutputRoot artifacts/pbr-${{ github.run_id }}-${{ github.run_attempt }} -RenderPreviews
      - name: Retain PBR authoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: procedural-pbr-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/pbr-*
          retention-days: 14
