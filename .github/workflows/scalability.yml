name: Scalability qualification

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      gpu:
        description: Run native lane on the designated reference machine
        type: boolean
        default: false
      soak:
        description: Capture extended CPU stability windows
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cpu-scale:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore ForgeLine.sln
      - run: dotnet build ForgeLine.sln --configuration Release --no-restore
      - name: Measurement and phase-authority contracts
        run: dotnet test --project tests/ForgeLine.Simulation.Tests/ForgeLine.Simulation.Tests.csproj --configuration Release --no-build -- --filter-class ForgeLine.Simulation.Tests.SimulationDiagnosticsTests ForgeLine.Simulation.Tests.ScalabilityMeasurementTests
      - name: Compile runtime assets
        run: dotnet run --project tools/ForgeLine.AssetCompiler/ForgeLine.AssetCompiler.csproj --configuration Release --no-build -- --source assets/source --runtime assets/runtime --clean --qualification-output artifacts/asset-qualification.json
      - name: CPU workload matrix
        # Timing remains advisory; these contracts gate report correctness.
        shell: pwsh
        run: ./build/Invoke-ScalabilityQualification.ps1 -NoBuild -Samples 256 -Soak:$${{ github.event_name == 'workflow_dispatch' && inputs.soak }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scalability-cpu
          path: artifacts/scalability/*.json
          if-no-files-found: warn
      - name: Completed GPU report contracts
        run: dotnet test --project tests/ForgeLine.Client.Tests/ForgeLine.Client.Tests.csproj --configuration Release --no-build -- --filter-class ForgeLine.Client.Tests.ClientSimulationHostTests
  native-reference:
    if: github.event_name == 'workflow_dispatch' && inputs.gpu
    runs-on: [self-hosted, Windows, X64, forgeline-performance]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore ForgeLine.sln
      - run: dotnet build ForgeLine.sln --configuration Release --no-restore
      - name: Compile runtime assets
        run: dotnet run --project tools/ForgeLine.AssetCompiler/ForgeLine.AssetCompiler.csproj --configuration Release --no-build -- --source assets/source --runtime assets/runtime --clean --qualification-output artifacts/asset-qualification.json
      - name: Reference hardware matrix
        shell: pwsh
        env:
          FORGELINE_D3D12_DEBUG_LAYER: '1'
        run: ./build/Invoke-ScalabilityQualification.ps1 -NoBuild -Gpu -Samples 4096
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scalability-native-reference
          path: artifacts/scalability/*.json
          if-no-files-found: warn
